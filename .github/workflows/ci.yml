name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    name: Tests and deterministic evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install packages
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Mocked tests (no network, no model)
        run: python -m pytest
        env:
          # Keep any data-folder use inside the runner; tests use their own temp folders.
          SIGNALDESK_HOME: ${{ runner.temp }}/signaldesk-home
      - name: Deterministic evaluation
        run: python -m eval.run_eval rules
        env:
          SIGNALDESK_HOME: ${{ runner.temp }}/signaldesk-home

  web:
    name: Web type check, lint and builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Type check
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Desktop build
        run: npm run build
      - name: Mobile build
        run: npm run build:mobile
